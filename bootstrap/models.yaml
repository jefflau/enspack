# Bootstrap mirror list for mirrors.enspack.eth
# Verified against the HF API on 2026-09-14. `storage_gb` is HF usedStorage
# (all revisions) and is an upper bound; the runner computes the exact
# snapshot size at `revision`. The runner re-checks license and gating at run
# time; `expected_license` is a guard, not a source of truth.
#
# Publishing name: v1-0-0.<org>--<repo>.mirrors.enspack.eth
# canonical:       <repo>.<org>.enspack.eth

publisher: mirrors.enspack.eth
license_allowlist: [apache-2.0, mit, bsd-3-clause, bsd-2-clause, cc0-1.0, cc-by-4.0, odc-by]
webseeds:
  huggingface: "https://huggingface.co/{repo}/resolve/{revision}/"
  huggingbay: "https://huggingbay.xyz/api/downloads/{hb_id}/"   # only when HB reports hosted files

